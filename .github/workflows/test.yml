name: test

on:
  push:
  pull_request:

jobs:
  test:
    # Windows: the codec round-trip runs the real capture.ps1 decoder.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
